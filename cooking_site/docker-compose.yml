version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cooking_site_db
    environment:
      POSTGRES_DB: cooking_site_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cooking_site_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: cooking_site_centrifugo
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo --config=config.json
    ports:
      - "8001:8000"
    depends_on:
      - redis

  maildev:
    image: maildev/maildev:latest
    container_name: cooking_site_maildev
    ports:
      - "1080:1080"
      - "1025:1025"

  web:
    build: .
    container_name: cooking_site_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
  celery-worker:
    build: .
    container_name: cooking_site_celery_worker
    command: celery -A cooking_site.celery_app worker -l INFO
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file: 
      - .env

  celery-beat:
    build: .
    container_name: cooking_site_celery_beat
    command: celery -A cooking_site.celery_app beat -l INFO --scheduler redbeat.RedBeatScheduler
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data: