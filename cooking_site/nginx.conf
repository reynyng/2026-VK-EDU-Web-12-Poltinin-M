events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 80;
        
        # Правильная отдача статики
        location /static/ {
            alias /app/staticfiles/;
        }
        
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
        }
    }
}