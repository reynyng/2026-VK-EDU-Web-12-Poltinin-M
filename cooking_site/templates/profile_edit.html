{% extends 'base.html' %}
{% load static %}

{% block title %}Редактирование профиля - Домашняя книга рецептов{% endblock %}

{% block content %}
<div class="h2_custom" style="margin-left: 30px;">Редактирование профиля</div>

<form method="post">
    {% csrf_token %}
    
    <div class="box_without_border" style="flex-direction: column; align-items: flex-start; gap: 20px;">
        
        <div style="width: 100%;">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email" 
                   value="{{ profile_user.email }}" 
                   style="width: 100%; padding: 10px; margin-top: 5px;">
        </div>

        <hr style="width: 100%; margin: 20px 0;">

        <h3>Смена пароля</h3>
        
        <div style="width: 100%;">
            <label for="old_password">Текущий пароль</label>
            <input type="password" id="old_password" name="old_password" 
                   placeholder="Введите текущий пароль"
                   style="width: 100%; padding: 10px; margin-top: 5px;">
        </div>

        <div style="width: 100%;">
            <label for="new_password1">Новый пароль</label>
            <input type="password" id="new_password1" name="new_password1" 
                   placeholder="Введите новый пароль"
                   style="width: 100%; padding: 10px; margin-top: 5px;">
            <small style="font-size: 12px; color: #666;">Минимум 8 символов</small>
        </div>

        <div style="width: 100%;">
            <label for="new_password2">Подтверждение нового пароля</label>
            <input type="password" id="new_password2" name="new_password2" 
                   placeholder="Повторите новый пароль"
                   style="width: 100%; padding: 10px; margin-top: 5px;">
        </div>

        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button type="submit" class="submit-btn">Сохранить изменения</button>
            <a href="{% url 'login_app:profile' %}" class="cancel-btn">Отмена</a>
        </div>
    </div>
</form>
{% endblock %}
